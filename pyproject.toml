[project]
name = "airfoil-noise"
version = "0.1.0"
description = "Linear regression on the UCI Airfoil Self-Noise dataset, with a static web demo."
readme = "README.md"
authors = [
    { name = "Aayush Singh", email = "ayushyoseph@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
airfoil-run = "airfoil_noise.pipeline:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.5",
    "nbconvert>=7.17.2",
]
